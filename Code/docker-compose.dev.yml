version: '3.8'

services:
  backend:
    build:
      context: ./Back/Bajon_audit_App
      dockerfile: Dockerfile.dev
    container_name: bajon_backend_dev
    volumes:
      # Mount le code source pour le hot reload (compatible Windows/Linux)
      - ./:/workspace:cached
      - ../.git:/workspace/.git
      - ../.devcontainer:/workspace/.devcontainer
      - bajon_backend_target:/workspace/Back/Bajon_audit_App/target
    env_file: /.env
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_USERNAME: bajon
      SPRING_DATASOURCE_PASSWORD: bajon

  frontend:
    build:
      context: ./Front/Bajon_Consulting_Audit_App
      dockerfile: Dockerfile.dev
    container_name: bajon_frontend_dev
    volumes:
      - ./:/workspace:cached
      - ../.git:/workspace/.git
      - ../.devcontainer:/workspace/.devcontainer
    env_file: /.env
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  bajon_backend_target:
